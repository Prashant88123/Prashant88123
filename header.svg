<svg viewBox="0 0 1000 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0f172a;#1e1b4b;#090d16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#0f172a;#172554;#1e1b4b" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1d4ed8;#090d16;#0f172a" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      .title { font: 800 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font: 600 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: url(#textGrad); }
      .mono { font: 500 14px 'Courier New', monospace; fill: #94a3b8; }
      .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 14px; }
      .badge-text { font: 600 12px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .pulse { fill: #10b981; animation: blink 2s infinite ease-in-out; }
      .wave { fill: rgba(56, 189, 248, 0.07); animation: float 6s infinite ease-in-out alternate; }
      .wave2 { fill: rgba(99, 102, 241, 0.08); animation: float 9s infinite ease-in-out alternate-reverse; }
      @keyframes blink { 0%, 100% { opacity: 1; r: 5px; } 50% { opacity: 0.35; r: 7px; } }
      @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-12px); } }
    </style>
  </defs>

  <!-- Animated Background -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Background Waves -->
  <path class="wave" d="M0,190 Q250,140 500,190 T1000,180 L1000,260 L0,260 Z" />
  <path class="wave2" d="M0,210 Q300,250 600,195 T1000,215 L1000,260 L0,260 Z" />

  <!-- Top Live Status Pill -->
  <rect x="350" y="24" width="300" height="28" class="badge-bg" />
  <circle cx="370" cy="38" r="5" class="pulse" />
  <text x="385" y="42" class="badge-text">OPEN TO SDE & FOUNDING ENGINEER ROLES</text>

  <!-- Main Name & Headline -->
  <text x="500" y="112" text-anchor="middle" class="title">Prashant</text>
  <text x="500" y="148" text-anchor="middle" class="subtitle">Full-Stack & Applied AI Engineer  |  Low-Latency Distributed Systems</text>

  <!-- Engineering Metric Highlights -->
  <text x="500" y="186" text-anchor="middle" class="mono">
    [12ms Spatial Queries]  •  [MongoDB ACID + Redis + BullMQ]  •  [PyTorch & LLM Agents]  •  [800+ DSA Solved]
  </text>
</svg>
